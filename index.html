<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SOYO">
<meta name="theme-color" content="#F7F5F0">
<link rel="manifest" href="manifest.json">
<title>SOYO 成本管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:#F7F5F0;color:#1a1a1a;min-height:100vh}
.app{max-width:860px;margin:0 auto;padding:1.5rem 1rem 3rem}
h1{font-size:22px;font-weight:500;margin-bottom:1.5rem}
.tabs{display:flex;gap:0;margin-bottom:1.5rem;border-bottom:1.5px solid #e0ddd8}
.tab{padding:11px 20px;font-size:14px;font-weight:500;cursor:pointer;border:none;background:none;color:#888;border-bottom:2px solid transparent;margin-bottom:-1.5px;transition:color .15s,border-color .15s;white-space:nowrap}
.tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a}
.page{display:none}.page.active{display:block}

/* summary */
.summary-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem}
.metric{background:#fff;border:1px solid #e5e2db;border-radius:10px;padding:14px 16px}
.metric-label{font-size:12px;color:#888;margin-bottom:6px}
.metric-value{font-size:20px;font-weight:500;color:#1a1a1a}
.metric-value.blue{color:#185FA5}

/* expense categories */
.category-card{background:#fff;border:1px solid #e5e2db;border-radius:12px;margin-bottom:10px;overflow:hidden}
.cat-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;user-select:none;transition:background .1s}
.cat-header:hover{background:#faf9f7}
.cat-left{display:flex;align-items:center;gap:10px}
.cat-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.cat-name{font-weight:500;font-size:15px}
.cat-badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;background:#FDF3E3;color:#854F0B;border:1px solid #f5d9b0;margin-left:6px}
.cat-right{display:flex;align-items:center;gap:10px}
.cat-total{font-size:14px;font-weight:500;color:#185FA5}
.cat-raw{font-size:12px;color:#aaa}
.cat-chevron{font-size:11px;color:#aaa;transition:transform .2s;display:inline-block}
.cat-chevron.open{transform:rotate(180deg)}
.cat-body{border-top:1px solid #f0ede8;padding:12px 16px;display:none}
.cat-body.open{display:block}
.amortize-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:10px 12px;background:#FDF7EF;border-radius:8px;border:1px solid #f5d9b0;flex-wrap:wrap}
.amortize-label{font-size:13px;color:#6b4f2a}
.amortize-input{width:60px;text-align:center;font-size:13px;padding:5px 8px;border:1px solid #e5c99a;border-radius:6px;background:#fff;color:#1a1a1a;outline:none}
.amortize-result{font-size:13px;font-weight:500;color:#854F0B;margin-left:auto}
.item-row{display:grid;grid-template-columns:1fr 140px 32px;gap:8px;align-items:center;margin-bottom:8px}
.item-input{font-size:13px;padding:7px 10px;border:1px solid #e5e2db;border-radius:8px;background:#fff;color:#1a1a1a;width:100%;outline:none}
.item-input:focus{border-color:#a3b8cc}
.item-amount{text-align:right}
.del-btn{width:30px;height:30px;border:1px solid #e5e2db;border-radius:8px;background:none;color:#bbb;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.del-btn:hover{background:#fef2f2;color:#c0392b;border-color:#f5c6c6}
.add-item-btn{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:#185FA5;background:none;border:none;cursor:pointer;padding:4px 0;margin-top:4px;opacity:.85}
.add-item-btn:hover{opacity:1}

/* products page */
.products-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.section-title{font-size:15px;font-weight:500}
.add-product-btn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:8px 16px;border:1px solid #c8c4bc;border-radius:8px;background:#fff;color:#1a1a1a;cursor:pointer;transition:background .1s}
.add-product-btn:hover{background:#f5f3ef}
.product-card{background:#fff;border:1px solid #e5e2db;border-radius:12px;padding:16px;margin-bottom:10px}
.product-inputs{display:grid;grid-template-columns:1fr 110px 120px;gap:10px;margin-bottom:10px}
.product-actions{display:flex;align-items:end;justify-content:flex-end;gap:8px;margin-bottom:10px}
.product-results{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-top:12px;border-top:1px solid #f0ede8}
.field-label{font-size:11px;color:#888;margin-bottom:5px;font-weight:500;letter-spacing:0.02em}
.field-input{font-size:13px;padding:7px 10px;border:1px solid #e5e2db;border-radius:8px;background:#fff;color:#1a1a1a;width:100%;outline:none}
.field-input:focus{border-color:#a3b8cc}
select.field-input{cursor:pointer}
.result-box{background:#f7f5f0;border-radius:8px;padding:10px 8px;text-align:center}
.result-label{font-size:11px;color:#888;margin-bottom:4px}
.result-value{font-size:15px;font-weight:500;color:#1a1a1a}
.result-value.green{color:#2d7a3a}
.result-value.blue{color:#185FA5}
.result-value.amber{color:#854F0B}
.result-value.red{color:#c0392b}

/* daily qty stepper */
.qty-stepper{display:flex;align-items:center;gap:6px}
.qty-btn{width:26px;height:26px;border:1px solid #e5e2db;border-radius:6px;background:#fff;color:#555;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;line-height:1;transition:background .1s}
.qty-btn:hover{background:#f0ede8}
.qty-val{font-size:14px;font-weight:500;min-width:28px;text-align:center;color:#1a1a1a}

/* cost hint bar */
.cost-hint{font-size:13px;color:#555;margin-bottom:1rem;padding:12px 14px;background:#fff;border:1px solid #e5e2db;border-radius:10px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.cost-hint strong{color:#185FA5;font-weight:500}
.hint-input{width:52px;text-align:center;font-size:13px;padding:3px 6px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#1a1a1a;outline:none}
.empty-state{text-align:center;padding:3rem 0;color:#aaa;font-size:14px}

/* monthly sales plan */
.plan-section{margin-top:2rem;padding-top:1.5rem;border-top:1.5px solid #e5e2db}
.plan-title{font-size:15px;font-weight:500;margin-bottom:1rem}
.plan-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.2rem}
.plan-table-wrap{background:#fff;border:1px solid #e5e2db;border-radius:12px;overflow:hidden}
.plan-table{width:100%;border-collapse:collapse;font-size:13px}
.plan-table th{background:#f7f5f0;padding:9px 14px;text-align:left;font-weight:500;font-size:12px;color:#555;border-bottom:1px solid #e5e2db}
.plan-table td{padding:10px 14px;border-bottom:1px solid #f0ede8;color:#1a1a1a}
.plan-table tr:last-child td{border-bottom:none}
.plan-table tr:hover td{background:#faf9f7}
.progress-bar-wrap{background:#f0ede8;border-radius:20px;height:6px;overflow:hidden;min-width:80px}
.progress-bar{height:6px;border-radius:20px;background:#185FA5;transition:width .3s}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.tag-hot{background:#FDF0EB;color:#993C1D}
.tag-ice{background:#EBF4FD;color:#0C447C}
.tag-sweet{background:#FBEAF0;color:#993556}
.tag-food{background:#EDF7ED;color:#27500A}
.tag-other{background:#EEEDF9;color:#3C3489}

/* calendar page */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem}
.cal-nav{display:flex;align-items:center;gap:12px}
.cal-nav-btn{width:32px;height:32px;border:1px solid #e5e2db;border-radius:8px;background:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .1s}
.cal-nav-btn:hover{background:#f5f3ef}
.cal-month-label{font-size:16px;font-weight:500;min-width:120px;text-align:center}
.cal-legend{display:flex;gap:16px;align-items:center}
.legend-dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:4px}
.legend-item{display:flex;align-items:center;font-size:12px;color:#555;cursor:pointer;padding:4px 10px;border-radius:20px;border:1px solid transparent;transition:all .1s}
.legend-item.active{border-color:#aaa;background:#f5f3ef}
.cal-grid-header{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cal-day-name{text-align:center;font-size:12px;color:#888;font-weight:500;padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;border:1.5px solid transparent;position:relative;user-select:none}
.cal-day.empty{cursor:default}
.cal-day.undecided{background:#f5f3ef;border-color:#e5e2db}
.cal-day.undecided:hover{background:#ece9e3;border-color:#ccc}
.cal-day.open-day{background:#d4edda;border-color:#5cb85c}
.cal-day.open-day:hover{background:#c3e6cb;border-color:#4cae4c}
.cal-day.closed-day{background:#ffd7d7;border-color:#e57373}
.cal-day.closed-day:hover{background:#ffc5c5;border-color:#e53935}
.cal-day-num{font-size:14px;font-weight:500;color:#1a1a1a}
.cal-day.closed-day .cal-day-num{color:#c0392b}
.cal-day.open-day .cal-day-num{color:#1a6b2e}
.cal-day-icon{font-size:10px;margin-top:1px}
.cal-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:1.2rem}
.cal-info{font-size:12px;color:#888;margin-top:10px;text-align:center}
.divider{height:1px;background:#e5e2db;margin:1.5rem 0}

@media(max-width:600px){
  .summary-bar,.plan-summary,.cal-stats{grid-template-columns:1fr 1fr}
  .product-inputs{grid-template-columns:1fr 1fr}
  .product-results{grid-template-columns:1fr 1fr}
  .tabs{overflow-x:auto}
}

/* sync indicator */
.sync-bar{position:fixed;bottom:16px;right:16px;display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 12px;border-radius:20px;border:1px solid #e5e2db;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.08);transition:opacity .3s;z-index:999}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#5cb85c;flex-shrink:0}
.sync-dot.saving{background:#f0a500;animation:pulse .8s infinite}
.sync-dot.error{background:#e57373}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>

let saveTimer = null;

async function sbFetch(path, options={}) {
  return fetch(SUPABASE_URL + path, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal',
      ...(options.headers||{})
    }
  });
}

function setSyncStatus(status, label) {
  const dot = document.getElementById('sync-dot');
  const lbl = document.getElementById('sync-label');
  if(!dot||!lbl) return;
  dot.className = 'sync-dot' + (status==='saving'?' saving': status==='error'?' error':'');
  lbl.textContent = label;
}

async function saveToCloud() {
  setSyncStatus('saving','儲存中…');
  const payload = {
    id: DATA_ROW_ID,
    data: JSON.stringify({
      categories: state.categories,
      openCategories: state.openCategories,
      renovationMonths: state.renovationMonths,
      products: state.products,
      calDays: state.calDays
    }),
    updated_at: new Date().toISOString()
  };
  try {
    const r = await sbFetch('/rest/v1/app_data', {
      method: 'POST',
      headers: { 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify(payload)
    });
    if(r.ok || r.status===200||r.status===201||r.status===204) {
      setSyncStatus('ok','已儲存 ✓');
    } else {
      const txt = await r.text();
      setSyncStatus('error','儲存失敗');
      console.error('Save error', r.status, txt);
    }
  } catch(e) {
    setSyncStatus('error','離線');
    console.error(e);
  }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToCloud, 800);
}

async function loadFromCloud() {
  setSyncStatus('saving','載入中…');
  try {
    const r = await sbFetch('/rest/v1/app_data?id=eq.' + DATA_ROW_ID + '&select=data');
    if(!r.ok) { setSyncStatus('error','載入失敗'); return false; }
    const rows = await r.json();
    if(!rows || rows.length===0) { setSyncStatus('ok','尚無雲端資料'); return false; }
    const saved = JSON.parse(rows[0].data);
    if(saved.categories)       state.categories       = saved.categories;
    if(saved.openCategories)   state.openCategories   = saved.openCategories;
    if(saved.renovationMonths) state.renovationMonths = saved.renovationMonths;
    if(saved.products)         state.products         = saved.products;
    if(saved.calDays)          state.calDays          = saved.calDays;
    // restore pid counter
    if(state.products.length>0) pid = Math.max(...state.products.map(p=>p.id||0));
    setSyncStatus('ok','已同步 ✓');
    return true;
  } catch(e) {
    setSyncStatus('error','離線');
    console.error(e);
    return false;
  }
}

  {id:'materials',  name:'材料費',    icon:'☕', bg:'#FDF0EB'},
  {id:'utilities',  name:'水電瓦斯費',icon:'💡', bg:'#FBF0F5'},
  {id:'internet',   name:'網路費',    icon:'📡', bg:'#E5F7F2'},
  {id:'extra',      name:'額外支出',  icon:'📦', bg:'#EEEDF9'}
];
const PRODUCT_TYPES = ['熱飲','冰飲','甜點','輕食','其他'];
const TYPE_TAG = {'熱飲':'tag-hot','冰飲':'tag-ice','甜點':'tag-sweet','輕食':'tag-food','其他':'tag-other'};
// Typical cafe order distribution weights per category
const TYPE_WEIGHT = {'熱飲':35,'冰飲':30,'甜點':15,'輕食':12,'其他':8};
const DAY_NAMES = ['日','一','二','三','四','五','六'];

let state = {
  categories: {},
  openCategories: {},
  renovationMonths: 12,
  products: [],       // {id, name, type, ingredientCost, targetDailyQty}
  calYear: new Date().getFullYear(),
  calMonth: new Date().getMonth(),
  calDays: {},        // key: "YYYY-M-D" -> 'open'|'closed'|'undecided'
  calMode: 'open'
};
let pid = 0;

CATEGORIES.forEach(c => {
  state.categories[c.id] = [{name:'',amount:''}];
  state.openCategories[c.id] = false;
});

/* ──────────────── HELPERS ──────────────── */
function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function fmt(n){ return 'NT$'+Math.round(n).toLocaleString(); }

function getCategoryRaw(id){
  return (state.categories[id]||[]).reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
}
function getCategoryMonthly(id){
  const cat=CATEGORIES.find(c=>c.id===id);
  const raw=getCategoryRaw(id);
  return (cat&&cat.oneTime) ? raw/(state.renovationMonths||1) : raw;
}
function getTotalExpenses(){
  return CATEGORIES.reduce((t,cat)=>t+getCategoryMonthly(cat.id),0);
}
function getOpenDaysInMonth(year,month){
  const days=[];
  const dim=new Date(year,month+1,0).getDate();
  for(let d=1;d<=dim;d++){
    const key=`${year}-${month}-${d}`;
    const st=state.calDays[key]||'undecided';
    if(st==='open') days.push(d);
  }
  return days;
}
function countMonthStatus(year,month){
  const dim=new Date(year,month+1,0).getDate();
  let open=0,closed=0,undecided=0;
  for(let d=1;d<=dim;d++){
    const st=state.calDays[`${year}-${month}-${d}`]||'undecided';
    if(st==='open') open++;
    else if(st==='closed') closed++;
    else undecided++;
  }
  return {open,closed,undecided,total:dim};
}

/* ──────────────── PRODUCT CALC (no re-render loop) ──────────────── */
function calcProduct(p){
  const openDays = getOpenDaysInMonth(state.calYear,state.calMonth);
  const activeDays = openDays.length || 30;
  const total = getTotalExpenses();
  const marginPct = parseInt(document.getElementById('margin-target')?.value||60)||60;
  const margin = marginPct/100;
  const ingCost = parseFloat(p.ingredientCost)||0;
  const costRatio = 1-margin;

  // If user set a target daily qty, work backwards to required price
  const targetDailyQty = p.targetDailyQty || 0;

  let suggestedPrice = 0;
  if(ingCost > 0){
    suggestedPrice = Math.ceil(ingCost/costRatio/5)*5;
  }

  // monthly qty = targetDailyQty * activeDays (if set), else derive from total
  let monthlyQty = 0, dailyQty = 0, priceForTarget = 0;
  if(targetDailyQty > 0 && activeDays > 0){
    monthlyQty = targetDailyQty * activeDays;
    dailyQty = targetDailyQty;
    // price needed to cover share of costs with this qty
    if(total > 0 && ingCost > 0){
      const totalQtyAllProducts = state.products.reduce((s,q)=>{
        const dq = q.targetDailyQty||0;
        return s + (dq>0 ? dq*activeDays : 0);
      },0);
      // suggested price stays cost-based; show required revenue per unit separately
    }
    priceForTarget = suggestedPrice; // keep cost-based price
  } else if(total > 0 && suggestedPrice > 0){
    monthlyQty = Math.ceil(total/suggestedPrice);
    dailyQty = Math.ceil(monthlyQty/activeDays);
    priceForTarget = suggestedPrice;
  }

  const profit = suggestedPrice > 0 ? suggestedPrice - ingCost : 0;
  const monthlyRevenue = suggestedPrice * monthlyQty;
  return {suggestedPrice, monthlyQty, dailyQty, profit, monthlyRevenue, activeDays};
}

/* ──────────────── SUMMARY (expenses page) ──────────────── */
function renderSummary(){
  const total=getTotalExpenses();
  const openDays=getOpenDaysInMonth(state.calYear,state.calMonth).length||30;
  const dailyTarget=total/openDays;
  const hours=parseInt(document.getElementById('daily-hours')?.value||10)||10;
  const hourlyTarget=dailyTarget/hours;
  const sb=document.getElementById('summary-bar');
  if(sb) sb.innerHTML=`
    <div class="metric"><div class="metric-label">每月總支出</div><div class="metric-value blue">${fmt(total)}</div></div>
    <div class="metric"><div class="metric-label">每日損益平衡目標</div><div class="metric-value">${fmt(dailyTarget)}<span style="font-size:12px;color:#aaa;font-weight:400">（${openDays}天）</span></div></div>
    <div class="metric"><div class="metric-label">每小時目標營業額</div><div class="metric-value">${fmt(hourlyTarget)}</div></div>
  `;
  const h=document.getElementById('hint-total');
  if(h) h.textContent=fmt(total);
}

/* ──────────────── CATEGORIES ──────────────── */
function renderCategories(){
  const container=document.getElementById('categories-container');
  if(!container) return;
  container.innerHTML='';
  CATEGORIES.forEach(cat=>{
    const items=state.categories[cat.id];
    const rawTotal=getCategoryRaw(cat.id);
    const monthlyTotal=getCategoryMonthly(cat.id);
    const isOpen=state.openCategories[cat.id];

    const amortizeBlock=cat.oneTime?`
      <div class="amortize-row">
        <span class="amortize-label">一次性支出，分攤月數：</span>
        <input class="amortize-input" type="number" min="1" max="120" value="${state.renovationMonths}"
          oninput="updateRenovationMonths(this.value)" onclick="event.stopPropagation()">
        <span style="font-size:13px;color:#6b4f2a">個月</span>
        <span class="amortize-result" id="reno-monthly">${rawTotal>0?'每月分攤：'+fmt(monthlyTotal):''}</span>
      </div>`:'';

    let rightHtml=cat.oneTime
      ?`<span class="cat-raw" id="total-raw-${cat.id}">${rawTotal>0?'總額 '+fmt(rawTotal):'—'}</span>
         <span class="cat-total" id="total-${cat.id}">${monthlyTotal>0?fmt(monthlyTotal)+'/月':''}</span>`
      :`<span class="cat-total" id="total-${cat.id}">${rawTotal>0?fmt(rawTotal):'—'}</span>`;

    const card=document.createElement('div');
    card.className='category-card';
    card.innerHTML=`
      <div class="cat-header" onclick="toggleCat('${cat.id}')">
        <div class="cat-left">
          <div class="cat-icon" style="background:${cat.bg}">${cat.icon}</div>
          <span class="cat-name">${cat.name}</span>
          ${cat.oneTime?'<span class="cat-badge">一次性</span>':''}
        </div>
        <div class="cat-right">${rightHtml}<span class="cat-chevron ${isOpen?'open':''}">▼</span></div>
      </div>
      <div class="cat-body ${isOpen?'open':''}" id="body-${cat.id}">
        ${amortizeBlock}
        <div id="items-${cat.id}">
          ${items.map((item,idx)=>`
            <div class="item-row">
              <input class="item-input" placeholder="子項目名稱" value="${escHtml(item.name)}"
                data-cat="${cat.id}" data-idx="${idx}" data-field="name">
              <input class="item-input item-amount" type="number" min="0" placeholder="金額" value="${item.amount}"
                data-cat="${cat.id}" data-idx="${idx}" data-field="amount">
              <button class="del-btn" onclick="deleteItem('${cat.id}',${idx})">✕</button>
            </div>`).join('')}
        </div>
        <button class="add-item-btn" onclick="addItem('${cat.id}')">＋ 新增子項目</button>
      </div>`;
    container.appendChild(card);
  });
  // Attach events via delegation — no oninput on inputs to avoid re-render
  attachCategoryInputs();
}

function attachCategoryInputs(){
  document.querySelectorAll('.item-input').forEach(input=>{
    input.addEventListener('input', e=>{
      const {cat,idx,field}=e.target.dataset;
      state.categories[cat][idx][field]=e.target.value;
      refreshCategoryTotal(cat);
      renderSummary();
      scheduleSave();
    });
  });
}

function refreshCategoryTotal(catId){
  const cat=CATEGORIES.find(c=>c.id===catId);
  const rawTotal=getCategoryRaw(catId);
  const monthly=getCategoryMonthly(catId);
  if(cat&&cat.oneTime){
    const tel=document.getElementById('total-'+catId);
    if(tel) tel.textContent=monthly>0?fmt(monthly)+'/月':'';
    const rel=document.getElementById('total-raw-'+catId);
    if(rel) rel.textContent=rawTotal>0?'總額 '+fmt(rawTotal):'—';
    const rm=document.getElementById('reno-monthly');
    if(rm) rm.textContent=rawTotal>0?'每月分攤：'+fmt(monthly):'';
  } else {
    const el=document.getElementById('total-'+catId);
    if(el) el.textContent=rawTotal>0?fmt(rawTotal):'—';
  }
}

function toggleCat(catId){
  state.openCategories[catId]=!state.openCategories[catId];
  renderCategories();
}
function updateRenovationMonths(val){
  state.renovationMonths=Math.max(1,parseInt(val)||1);
  scheduleSave();
  refreshCategoryTotal('renovation');
  renderSummary();
}
function addItem(catId){
  state.categories[catId].push({name:'',amount:''});
  scheduleSave();
  renderCategories();
}
function deleteItem(catId,idx){
  if(state.categories[catId].length===1){
    state.categories[catId][0]={name:'',amount:''};
  } else {
    state.categories[catId].splice(idx,1);
  }
  renderCategories();
  renderSummary();
  scheduleSave();
}

/* ──────────────── PRODUCTS ──────────────── */
function addProduct(){
  state.products.push({id:++pid,name:'',type:'熱飲',ingredientCost:'',targetDailyQty:0});
  scheduleSave();
  renderProducts();
  // Focus name input of new card without re-render
  setTimeout(()=>{
    const inputs=document.querySelectorAll('.prod-name-input');
    if(inputs.length) inputs[inputs.length-1].focus();
  },50);
}

function deleteProduct(id){
  state.products=state.products.filter(x=>x.id!==id);
  scheduleSave();
  renderProducts();
}

function adjustDailyQty(id, delta){
  const p=state.products.find(x=>x.id===id);
  if(!p) return;
  p.targetDailyQty=Math.max(0,(p.targetDailyQty||0)+delta);
  const inp=document.getElementById('qty-val-'+id);
  if(inp) inp.value=p.targetDailyQty>0?p.targetDailyQty:'';
  updateProductResultsOnly(p);
  renderPlanSection();
}

function updateProductResultsOnly(p){
  const c=calcProduct(p);
  const el=document.getElementById('prod-results-'+p.id);
  if(!el) return;
  el.innerHTML=buildResultBoxes(p,c);
  const qv=document.getElementById('qty-val-'+p.id);
  if(qv) qv.textContent=p.targetDailyQty>0?p.targetDailyQty:'自動';
}

function buildResultBoxes(p,c){
  return `
    <div class="result-box">
      <div class="result-label">建議售價</div>
      <div class="result-value blue">${c.suggestedPrice>0?fmt(c.suggestedPrice):'—'}</div>
    </div>
    <div class="result-box">
      <div class="result-label">每份毛利</div>
      <div class="result-value green">${c.profit>0?fmt(c.profit):'—'}</div>
    </div>
    <div class="result-box">
      <div class="result-label">每月最低銷量</div>
      <div class="result-value amber">${c.monthlyQty>0?c.monthlyQty.toLocaleString()+' 份':'—'}</div>
    </div>
    <div class="result-box">
      <div class="result-label">每月營業天</div>
      <div class="result-value">${c.activeDays} 天</div>
    </div>`;
}

function renderProducts(){
  renderSummary();
  const container=document.getElementById('products-container');
  if(!container) return;
  if(state.products.length===0){
    container.innerHTML='<div class="empty-state">點擊「新增產品」開始建立產品定價</div>';
    renderPlanSection();
    return;
  }

  // Build HTML without destroying existing DOM for unchanged cards
  // Use a keyed approach: remove cards not in state, add/update cards
  const existingIds=new Set([...container.querySelectorAll('.product-card')].map(el=>el.dataset.pid).filter(Boolean).map(Number));
  const stateIds=new Set(state.products.map(p=>p.id));

  // Remove deleted
  existingIds.forEach(eid=>{
    if(!stateIds.has(eid)){
      const el=container.querySelector(`[data-pid="${eid}"]`);
      if(el) el.remove();
    }
  });

  // Add new / reorder
  state.products.forEach((p,i)=>{
    let card=container.querySelector(`[data-pid="${p.id}"]`);
    if(!card){
      card=buildProductCard(p);
      container.appendChild(card);
    } else {
      // Update result boxes only (inputs keep focus)
      const c=calcProduct(p);
      const resEl=document.getElementById('prod-results-'+p.id);
      if(resEl) resEl.innerHTML=buildResultBoxes(p,c);
    }
  });

  renderPlanSection();
}

function buildProductCard(p){
  const c=calcProduct(p);
  const card=document.createElement('div');
  card.className='product-card';
  card.dataset.pid=p.id;
  card.innerHTML=`
    <div style="display:flex;align-items:start;gap:10px;margin-bottom:10px">
      <div style="flex:1">
        <div class="field-label">產品名稱</div>
        <input class="field-input prod-name-input" placeholder="例：拿鐵" value="${escHtml(p.name)}"
          data-pid="${p.id}" data-field="name">
      </div>
      <div style="width:110px">
        <div class="field-label">產品類型</div>
        <select class="field-input" data-pid="${p.id}" data-field="type">
          ${PRODUCT_TYPES.map(t=>`<option ${p.type===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div style="width:120px">
        <div class="field-label">食材成本 (NT$)</div>
        <input class="field-input" type="number" min="0" placeholder="0" value="${p.ingredientCost}"
          data-pid="${p.id}" data-field="ingredientCost" style="text-align:right">
      </div>
      <div style="padding-top:22px">
        <button class="del-btn" onclick="deleteProduct(${p.id})">✕</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f7f5f0;border-radius:8px;margin-bottom:10px">
      <span style="font-size:12px;color:#555;flex:1">每日目標銷售數量</span>
      <div class="qty-stepper">
        <button class="qty-btn" onclick="adjustDailyQty(${p.id},-1)">−</button>
        <input type="number" min="0" class="qty-text-input" id="qty-val-${p.id}"
          value="${p.targetDailyQty>0?p.targetDailyQty:''}" placeholder="自動"
          data-pid="${p.id}" data-field="targetDailyQty"
          style="width:52px;text-align:center;font-size:14px;font-weight:500;padding:3px 4px;border:1px solid #e5e2db;border-radius:6px;background:#fff;color:#1a1a1a;outline:none">
        <button class="qty-btn" onclick="adjustDailyQty(${p.id},1)">＋</button>
      </div>
      <span style="font-size:12px;color:#aaa">份/天　（0=自動計算）</span>
    </div>
    <div class="product-results" id="prod-results-${p.id}">
      ${buildResultBoxes(p,c)}
    </div>`;

  // Attach events — key: input events on name/cost don't trigger full re-render
  card.querySelectorAll('input[data-pid],select[data-pid]').forEach(el=>{
    const evt=el.tagName==='SELECT'?'change':'input';
    el.addEventListener(evt,e=>{
      const {pid,field}=e.target.dataset;
      const prod=state.products.find(x=>x.id===Number(pid));
      if(!prod) return;
      if(field==='targetDailyQty'){
        prod.targetDailyQty=Math.max(0,parseInt(e.target.value)||0);
      } else {
        prod[field]=e.target.value;
      }
      scheduleSave();
      // Only update results, not the entire card
      const c2=calcProduct(prod);
      const resEl=document.getElementById('prod-results-'+pid);
      if(resEl) resEl.innerHTML=buildResultBoxes(prod,c2);
      renderSummary();
      renderPlanSection();
    });
  });

  return card;
}

/* ──────────────── MONTHLY SALES PLAN ──────────────── */
function renderPlanSection(){
  const sec=document.getElementById('plan-section');
  if(!sec) return;
  if(state.products.length===0){sec.innerHTML='';return;}

  const total=getTotalExpenses();
  const openDays=getOpenDaysInMonth(state.calYear,state.calMonth).length||30;
  const marginPct=parseInt(document.getElementById('margin-target')?.value||60)||60;

  // Build plan: distribute product targets or use weight-based distribution
  // Group products by type
  const typeGroups={};
  PRODUCT_TYPES.forEach(t=>typeGroups[t]=[]);
  state.products.forEach(p=>{ if(typeGroups[p.type]) typeGroups[p.type].push(p); });

  // For each product, compute monthly qty
  let rows=[];
  let totalMonthlyRevenue=0;

  state.products.forEach(p=>{
    const ingCost=parseFloat(p.ingredientCost)||0;
    const marginFrac=marginPct/100;
    const suggestedPrice=ingCost>0?Math.ceil(ingCost/(1-marginFrac)/5)*5:0;
    if(suggestedPrice<=0) return;

    let monthlyQty;
    if(p.targetDailyQty>0){
      monthlyQty=p.targetDailyQty*openDays;
    } else {
      // Use type weight to allocate share of required revenue
      const typeWeight=TYPE_WEIGHT[p.type]||10;
      // How many products of this type?
      const sameType=state.products.filter(q=>{
        const ip=parseFloat(q.ingredientCost)||0;
        return q.type===p.type&&ip>0;
      });
      const perProduct=sameType.length>0?1/sameType.length:1;
      const allocatedRevenue=total*(typeWeight/100)*perProduct;
      monthlyQty=Math.ceil(allocatedRevenue/suggestedPrice);
    }

    const monthlyRev=suggestedPrice*monthlyQty;
    totalMonthlyRevenue+=monthlyRev;
    rows.push({
      name:p.name||'（未命名）',
      type:p.type,
      suggestedPrice,
      monthlyQty,
      dailyQty:Math.ceil(monthlyQty/openDays),
      monthlyRev
    });
  });

  if(rows.length===0){sec.innerHTML='';return;}

  // 計算每月最低銷售量：依各產品計劃營收比例分配總支出，再除以建議售價
  const planTotalRev=rows.reduce((s,r)=>s+r.monthlyRev,0);
  rows=rows.map(r=>{
    let minMonthlyQty=0;
    if(planTotalRev>0&&r.suggestedPrice>0&&total>0){
      const share=r.monthlyRev/planTotalRev;
      const allocatedCost=total*share;
      minMonthlyQty=Math.ceil(allocatedCost/r.suggestedPrice);
    }
    const minDailyQty=openDays>0?Math.ceil(minMonthlyQty/openDays):0;
    return {...r, minMonthlyQty, minDailyQty};
  });

  const maxRev=Math.max(...rows.map(r=>r.monthlyRev));
  const coveragePct=total>0?Math.min(100,Math.round(totalMonthlyRevenue/total*100)):0;
  const totalMinQty=rows.reduce((s,r)=>s+r.minMonthlyQty,0);

  sec.innerHTML=`
    <div class="plan-section">
      <div class="plan-title">每月建議銷售計劃</div>
      <div class="plan-summary">
        <div class="metric"><div class="metric-label">計劃總月營收</div><div class="metric-value blue">${fmt(totalMonthlyRevenue)}</div></div>
        <div class="metric"><div class="metric-label">每月總支出</div><div class="metric-value">${fmt(total)}</div></div>
        <div class="metric"><div class="metric-label">支出覆蓋率</div>
          <div class="metric-value ${coveragePct>=100?'green':coveragePct>=80?'amber':'red'}">${coveragePct}%</div>
        </div>
      </div>
      <div class="plan-table-wrap">
        <table class="plan-table">
          <thead><tr>
            <th>產品名稱</th><th>類型</th><th>建議售價</th>
            <th>每月建議銷量</th><th>每日建議</th>
            <th style="border-left:2px solid #e5e2db;background:#fdf8f3;color:#854F0B">每月最低銷量</th>
            <th style="background:#fdf8f3;color:#854F0B">每日最低銷售</th>
            <th>月營收</th><th>佔比</th>
          </tr></thead>
          <tbody>
            ${rows.map(r=>`<tr>
              <td style="font-weight:500">${escHtml(r.name)}</td>
              <td><span class="tag ${TYPE_TAG[r.type]||'tag-other'}">${r.type}</span></td>
              <td>${fmt(r.suggestedPrice)}</td>
              <td>${r.monthlyQty.toLocaleString()} 份</td>
              <td>${r.dailyQty} 份</td>
              <td style="border-left:2px solid #e5e2db;background:#fdf8f3">
                <span style="font-weight:500;color:#854F0B">${r.minMonthlyQty.toLocaleString()} 份</span>
                <div style="font-size:11px;color:#aaa;margin-top:2px">${fmt(r.minMonthlyQty*r.suggestedPrice)}</div>
              </td>
              <td style="background:#fdf8f3">
                <span style="font-weight:500;color:#854F0B">${r.minDailyQty} 份</span>
              </td>
              <td>${fmt(r.monthlyRev)}</td>
              <td>
                <div class="progress-bar-wrap">
                  <div class="progress-bar" style="width:${maxRev>0?Math.round(r.monthlyRev/maxRev*100):0}%"></div>
                </div>
              </td>
            </tr>`).join('')}
          </tbody>
          <tfoot>
            <tr style="background:#f7f5f0;font-weight:500">
              <td colspan="3" style="padding:10px 14px;font-size:13px;color:#555">合計</td>
              <td style="padding:10px 14px">${rows.reduce((s,r)=>s+r.monthlyQty,0).toLocaleString()} 份</td>
              <td style="padding:10px 14px">${rows.reduce((s,r)=>s+r.dailyQty,0)} 份</td>
              <td style="padding:10px 14px;border-left:2px solid #e5e2db;background:#fdf8f3">
                <span style="font-weight:500;color:#854F0B">${totalMinQty.toLocaleString()} 份</span>
                <div style="font-size:11px;color:#aaa;margin-top:2px">${fmt(total)}（=支出）</div>
              </td>
              <td style="padding:10px 14px;background:#fdf8f3">
                <span style="font-weight:500;color:#854F0B">${rows.reduce((s,r)=>s+r.minDailyQty,0)} 份</span>
              </td>
              <td style="padding:10px 14px">${fmt(totalMonthlyRevenue)}</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div style="font-size:12px;color:#888;margin-top:8px;padding:0 2px">
        * <strong style="color:#854F0B;font-weight:500">每月最低銷量</strong>：依各產品計劃營收比例分配每月總支出，再除以建議售價，達到此數量即可打平當月全部支出。<br>
        * 未設定每日目標數量的產品，依消費行為比例（熱飲35%、冰飲30%、甜點15%、輕食12%、其他8%）分配。計算基於 ${openDays} 個營業天。
      </div>
    </div>`;
}

/* ──────────────── CALENDAR ──────────────── */
function setMode(m){
  state.calMode=m;
  document.querySelectorAll('.legend-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('mode-'+m)?.classList.add('active');
}

function calKey(y,mo,d){ return `${y}-${mo}-${d}`; }

function renderCalendar(){
  const y=state.calYear, mo=state.calMonth;
  const monthNames=['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  document.getElementById('cal-month-label').textContent=`${y} 年 ${monthNames[mo]}`;

  const dn=document.getElementById('cal-day-names');
  dn.innerHTML=DAY_NAMES.map(d=>`<div class="cal-day-name">${d}</div>`).join('');

  const firstDay=new Date(y,mo,1).getDay();
  const dim=new Date(y,mo+1,0).getDate();
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';

  for(let i=0;i<firstDay;i++){
    const blank=document.createElement('div');
    blank.className='cal-day empty';
    grid.appendChild(blank);
  }
  for(let d=1;d<=dim;d++){
    const key=calKey(y,mo,d);
    const st=state.calDays[key]||'undecided';
    const cell=document.createElement('div');
    cell.className=`cal-day ${st==='open'?'open-day':st==='closed'?'closed-day':'undecided'}`;
    cell.dataset.key=key;
    const icon=st==='open'?'✓':st==='closed'?'✕':'';
    cell.innerHTML=`<span class="cal-day-num">${d}</span><span class="cal-day-icon">${icon}</span>`;
    cell.addEventListener('click',()=>toggleCalDay(key));
    grid.appendChild(cell);
  }

  renderCalStats();
}

function toggleCalDay(key){
  const current=state.calDays[key]||'undecided';
  state.calDays[key]=state.calMode;
  scheduleSave();
  // Update just this cell
  const cell=document.querySelector(`[data-key="${key}"]`);
  if(cell){
    cell.className=`cal-day ${state.calMode==='open'?'open-day':state.calMode==='closed'?'closed-day':'undecided'}`;
    const icon=state.calMode==='open'?'✓':state.calMode==='closed'?'✕':'';
    const [numEl,iconEl]=cell.children;
    if(iconEl) iconEl.textContent=icon;
  }
  renderCalStats();
  renderSummary();
  // Update product results if products tab active
  if(document.getElementById('page-products').classList.contains('active')){
    state.products.forEach(p=>updateProductResultsOnly(p));
    renderPlanSection();
  }
}

function renderCalStats(){
  const {open,closed,undecided,total}=countMonthStatus(state.calYear,state.calMonth);
  const totalExp=getTotalExpenses();
  const dailyTarget=open>0?totalExp/open:0;
  const stats=document.getElementById('cal-stats');
  stats.innerHTML=`
    <div class="metric"><div class="metric-label" style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:#5cb85c;display:inline-block"></span>營業天數</div><div class="metric-value" style="color:#1a6b2e">${open} 天</div></div>
    <div class="metric"><div class="metric-label" style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:#e57373;display:inline-block"></span>休假天數</div><div class="metric-value" style="color:#c0392b">${closed} 天</div></div>
    <div class="metric"><div class="metric-label" style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:#ccc;display:inline-block"></span>未決定</div><div class="metric-value" style="color:#888">${undecided} 天</div></div>
    <div class="metric"><div class="metric-label">每日損益目標</div><div class="metric-value blue">${open>0?fmt(dailyTarget):'—'}</div></div>
  `;
  const info=document.getElementById('cal-info');
  info.textContent=open>0
    ?`本月共 ${total} 天，${open} 天營業、${closed} 天休假，每日至少需達成 ${fmt(dailyTarget)} 營業額。`
    :`尚未設定任何營業日，請點選日期標示狀態。`;
}

function calPrev(){
  if(state.calMonth===0){state.calMonth=11;state.calYear--;}
  else state.calMonth--;
  renderCalendar();
}
function calNext(){
  if(state.calMonth===11){state.calMonth=0;state.calYear++;}
  else state.calMonth++;
  renderCalendar();
}

/* ──────────────── TAB SWITCHING ──────────────── */
function switchTab(tab){
  ['expenses','products','calendar'].forEach((t,i)=>{
    document.querySelectorAll('.tab')[i]?.classList.toggle('active',t===tab);
    document.getElementById('page-'+t)?.classList.toggle('active',t===tab);
  });
  if(tab==='products') renderProducts();
  if(tab==='calendar') renderCalendar();
  if(tab==='expenses') renderSummary();
}

/* ──────────────── GLOBAL INPUT LISTENER ──────────────── */
document.addEventListener('input',e=>{
  if(['daily-hours','margin-target'].includes(e.target.id)){
    renderSummary();
    if(document.getElementById('page-products').classList.contains('active')){
      state.products.forEach(p=>updateProductResultsOnly(p));
      renderPlanSection();
    }
  }
});

/* ──────────────── INIT ──────────────── */
(async()=>{
  const loaded = await loadFromCloud();
  renderSummary();
  renderCategories();
  renderCalendar();
  if(loaded) renderProducts();
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
